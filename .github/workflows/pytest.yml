# Full pytest, including the Playwright Chromium autofill suite.
# PRs and non-main pushes run this workflow directly. Pushes to main run it
# via fly-deploy.yml so a red suite cannot deploy.
name: Tests

on:
  pull_request:
  push:
    branches-ignore:
      - main
  workflow_call:

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            worker/requirements.txt

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r worker/requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('worker/requirements.txt') }}

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: pytest
        env:
          CI: true
        run: python -m pytest -q --tb=short
