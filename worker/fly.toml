# Submit worker — a separate Fly app from the main one.
#   fly launch --no-deploy --name job-search-worker  (or edit app name below)
#   fly secrets set BASE_URL=https://job-search-tool.fly.dev APPLY_API_TOKEN=… -a job-search-worker
#   fly deploy -c worker/fly.toml -a job-search-worker
app = "job-search-worker"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  WORKER_POLL_SECONDS = "5"

# Scale to zero when idle — this box only needs to run while you're applying.
# Bump it awake by creating a fill request (the main app can't auto-wake it; for a
# personal tool, keep min_machines_running = 1 if you want instant fills).
[[vm]]
  size = "shared-cpu-1x"
  memory = "2gb"

[deploy]
  min_machines_running = 0
