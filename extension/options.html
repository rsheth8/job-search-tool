<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Job Apply Autofill — settings</title>
  <link rel="stylesheet" href="theme.css">
  <style>
    body { font-size: 14px; max-width: 560px; margin: 28px auto; padding: 0 16px; }
    h1 { font-size: 18px; }
    h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em;
         color: var(--dim); margin-top: 26px; }
    .row { display: flex; gap: 12px; } .row > div { flex: 1; }
    .check { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
    .check input { width: auto; }
    button { width: auto; margin-top: 18px; padding: 9px 16px; font-size: 14px; }
    .hint { color: var(--dim); font-size: 12px; margin: 4px 0 0; }
    #status { margin-left: 10px; color: var(--ok); font-weight: 600; }
  </style>
</head>
<body>
  <h1>Job Apply Autofill</h1>
  <p class="hint">Point this at your job-search-tool server, then fill in the facts
    every application asks for. As you focus a field on an application, you'll get an
    inline suggestion to accept. Nothing is ever submitted for you.</p>

  <h2>Connection</h2>
  <label>Server URL</label>
  <input id="baseUrl" placeholder="https://job-search-tool.fly.dev">
  <div class="row">
    <div><label>User id</label><input id="user" placeholder="local"></div>
    <div><label>API token (optional)</label><input id="token" placeholder="if APPLY_API_TOKEN is set"></div>
  </div>
  <label>Current posting id (optional)</label>
  <input id="postingId" placeholder="e.g. 42 — lets 'Draft answer' use that job's context">

  <h2>You</h2>
  <div class="row">
    <div><label>First name</label><input id="first_name"></div>
    <div><label>Last name</label><input id="last_name"></div>
  </div>
  <div class="row">
    <div><label>Preferred name</label><input id="preferred_name"></div>
    <div><label>Pronouns</label><input id="pronouns" placeholder="she/her"></div>
  </div>
  <div class="row">
    <div><label>Email</label><input id="email" type="email"></div>
    <div><label>Phone</label><input id="phone"></div>
  </div>
  <label>Street address</label>
  <input id="address">
  <div class="row">
    <div><label>City</label><input id="city"></div>
    <div><label>State</label><input id="state"></div>
    <div><label>Zip</label><input id="zip"></div>
    <div><label>Country</label><input id="country"></div>
  </div>
  <label>Current location <span style="font-weight:400;color:#888">(how "Current location" fields want it, e.g. "Chicago, IL" — auto-fills from City/State if blank)</span></label>
  <input id="location" placeholder="Chicago, IL">
  <div class="row">
    <div><label>LinkedIn</label><input id="linkedin"></div>
    <div><label>GitHub</label><input id="github"></div>
  </div>
  <label>Portfolio / website</label>
  <input id="portfolio">

  <h2>Education &amp; experience</h2>
  <div class="row">
    <div><label>School</label><input id="school"></div>
    <div><label>Grad year</label><input id="grad_year"></div>
  </div>
  <div class="row">
    <div><label>Degree</label><input id="degree" placeholder="B.S."></div>
    <div><label>Major / discipline</label><input id="discipline" placeholder="Computer Science"></div>
    <div><label>GPA</label><input id="gpa"></div>
  </div>
  <div class="row">
    <div><label>Current company</label><input id="current_company"></div>
    <div><label>Current title</label><input id="current_title"></div>
    <div><label>Years experience</label><input id="years_experience"></div>
  </div>

  <h2>Logistics</h2>
  <div class="row">
    <div><label>Salary expectation</label><input id="salary_expectation" placeholder="$120,000"></div>
    <div><label>Earliest start date</label><input id="start_date" placeholder="Immediately"></div>
  </div>
  <div class="check"><input type="checkbox" id="work_authorized"><label style="margin:0">Authorized to work (no sponsorship issues)</label></div>
  <div class="check"><input type="checkbox" id="needs_sponsorship"><label style="margin:0">Will require visa sponsorship</label></div>
  <div class="check"><input type="checkbox" id="willing_to_relocate"><label style="margin:0">Willing to relocate</label></div>

  <div><button id="save">Save</button><span id="status"></span></div>

  <script src="options.js"></script>
</body>
</html>
