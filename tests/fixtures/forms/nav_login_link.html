<!doctype html>
<!-- A company careers page. It has a "Sign in" link in the site nav, like almost
     every careers page does, and the application itself is behind "Apply now".
     The nav link is not a login wall. -->
<html>
<head><meta charset="utf-8"><title>Careers — Northwind</title></head>
<body>
  <nav>
    <a href="/products">Products</a>
    <a href="/login">Sign in</a>
    <a href="/signup">Create account</a>
  </nav>
  <h1>Backend Engineer</h1>
  <p>We are hiring.</p>
  <button id="apply">Apply now</button>
</body>
</html>
