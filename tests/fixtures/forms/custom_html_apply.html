<!doctype html>
<!-- Generic company careers HTML — not Greenhouse/Lever/Ashby. Fill should
     still match identity fields the same way. -->
<html>
<head><meta charset="utf-8"><title>Careers — Northwind</title></head>
<body>
  <h1>Apply — Backend Engineer</h1>
  <form id="careers_form" action="/submitted" method="post">
    <label for="first_name">First name</label>
    <input type="text" id="first_name" name="first_name">

    <label for="last_name">Last name</label>
    <input type="text" id="last_name" name="last_name">

    <label for="email">Email</label>
    <input type="email" id="email" name="email">

    <label for="phone">Phone</label>
    <input type="tel" id="phone" name="phone">

    <label for="linkedin">LinkedIn profile</label>
    <input type="text" id="linkedin" name="linkedin">

    <button type="submit" id="submit_app">Submit application</button>
  </form>
</body>
</html>
