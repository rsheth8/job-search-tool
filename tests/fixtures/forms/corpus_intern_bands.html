<!doctype html>
<!-- Banded intern questions (GPA / season / grad window / country+1) plus the
     combined work-auth+sponsorship question that is Yes only if you need no visa. -->
<html>
<head><meta charset="utf-8"><title>Apply — intern bands</title></head>
<body>
  <form>
    <label for="gpa">Cumulative GPA</label>
    <select id="gpa" name="gpa">
      <option value="">Select…</option>
      <option>3.7 - 4.0</option>
      <option>3.1 - 3.6</option>
      <option>3.0 or under</option>
    </select>

    <label for="when">When do you graduate?</label>
    <select id="when" name="grad">
      <option value="">Select…</option>
      <option>Sept - Dec 2027</option>
      <option>Jan - April 2028</option>
      <option>May - Aug 2028</option>
    </select>

    <label for="season">Do you prefer a winter or summer internship?</label>
    <select id="season" name="season">
      <option value="">Select…</option>
      <option>Winter 2027</option>
      <option>Summer 2027</option>
    </select>

    <label for="hisp">Are you Hispanic or Latino?</label>
    <select id="hisp" name="hispanic">
      <option value="">Select…</option>
      <option>Hispanic or Latino</option>
      <option>Not Hispanic or Latino</option>
    </select>

    <label for="cc">Country</label>
    <select id="cc" name="job_application[country]">
      <option value="">Select…</option>
      <option>Afghanistan+93</option>
      <option>United States+1</option>
      <option>Canada+1</option>
    </select>

    <label for="deg">Degree</label>
    <select id="deg" name="job_application[educations][][degree]">
      <option value="">Select…</option>
      <option>Bachelor's Degree</option>
      <option>Master's Degree</option>
    </select>

    <fieldset>
      <legend>Do you have the legal right to work in the United States without employer sponsorship?</legend>
      <label><input type="radio" name="combo_auth" value="Yes"> Yes</label>
      <label><input type="radio" name="combo_auth" value="No"> No</label>
    </fieldset>

    <fieldset>
      <legend>Are you authorized to work in Canada?</legend>
      <label><input type="radio" name="canada_auth" value="Yes"> Yes</label>
      <label><input type="radio" name="canada_auth" value="No"> No</label>
    </fieldset>

    <button type="submit">Submit</button>
  </form>
</body>
</html>
