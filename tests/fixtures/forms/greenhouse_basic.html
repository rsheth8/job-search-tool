<!doctype html>
<!-- Greenhouse-shaped application form: plain text fields, a native <select>, and
     two file inputs (resume + cover letter) so we can prove the resume only ever
     lands on the resume field. -->
<html>
<head><meta charset="utf-8"><title>Apply — Acme (Greenhouse)</title></head>
<body>
  <h1>Apply for Software Engineer</h1>
  <form id="application_form" action="/submitted" method="post">
    <label for="first_name">First Name *</label>
    <input type="text" id="first_name" name="job_application[first_name]">

    <label for="last_name">Last Name *</label>
    <input type="text" id="last_name" name="job_application[last_name]">

    <label for="email">Email *</label>
    <input type="email" id="email" name="job_application[email]">

    <label for="phone">Phone</label>
    <input type="tel" id="phone" name="job_application[phone]">

    <label for="location">Current Location</label>
    <input type="text" id="location" name="job_application[location]">

    <label for="linkedin">LinkedIn Profile</label>
    <input type="text" id="linkedin" name="job_application[urls][LinkedIn]">

    <label for="country">Country</label>
    <select id="country" name="job_application[country]">
      <option value="">Select…</option>
      <option>United States</option>
      <option>Canada</option>
      <option>United Kingdom</option>
    </select>

    <label for="resume">Resume/CV *</label>
    <input type="file" id="resume" name="job_application[resume]">

    <label for="cover">Cover Letter</label>
    <input type="file" id="cover" name="job_application[cover_letter]">

    <label for="favorite">Favorite color</label>
    <input type="text" id="favorite" name="job_application[favorite]">

    <button type="submit" id="submit_app">Submit Application</button>
  </form>
</body>
</html>
