# TEST-ONLY XcodeGen spec: the app target plus a JPUITests target, so the
# onboarding/autofill flows can be driven headlessly in the simulator.
#
#   cd ios && xcodegen generate --spec .uitest.yml
#   xcodebuild test -project JobPilotUITest.xcodeproj -scheme JPUITests \
#     -destination "platform=iOS Simulator,name=iPhone 16" CODE_SIGNING_ALLOWED=NO
#
# NEVER ship a build made from this spec. It sets
# LSSupportsOpeningDocumentsInPlace and UIFileSharingEnabled (below) so a test
# can drop a PDF into the app container and reach it through the document
# picker. Those keys expose the app's Documents directory over USB/Finder and
# are deliberately absent from ios/project.yml, which is the only spec that
# builds shipping app. Regenerate after adding a source file, or
# -only-testing silently matches nothing and the run reports success.
name: JobPilotUITest
options:
  bundleIdPrefix: com.rahil
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  JobPilot:
    type: application
    platform: iOS
    sources:
      - JobPilot
    info:
      path: JobPilot/Info.plist
      properties:
        CFBundleDisplayName: JobPilot
        UILaunchScreen:
          UIColorName: Fog
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
        SentryDSN: ""
        # Test-only: exposes the app's Documents folder in Files -> "On My iPhone",
        # so the .fileImporter document picker can reach a resume we drop in.
        # NOT in ios/project.yml -- the shipping app does not get these.
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rahil.jobpilot
        GENERATE_INFOPLIST_FILE: NO
  JPUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - JPUITests
    dependencies:
      - target: JobPilot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rahil.jpuitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  JPUITests:
    build:
      targets:
        JobPilot: all
        JPUITests: [test]
    test:
      targets:
        - JPUITests
