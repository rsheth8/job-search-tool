# XcodeGen project definition — the whole Xcode project is generated from this text.
#   brew install xcodegen && cd ios && xcodegen generate && open JobPilot.xcodeproj
# (or just create a new SwiftUI app in Xcode named JobPilot and drop the JobPilot/ sources in).
name: JobPilot
options:
  bundleIdPrefix: com.rahil
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "P28MCS4P38"
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  JobPilot:
    type: application
    platform: iOS
    sources:
      - JobPilot
    info:
      path: JobPilot/Info.plist
      properties:
        CFBundleDisplayName: JobPilot
        UILaunchScreen:
          UIColorName: Fog
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
        # Documents (a transcript, mostly) are stored on the phone and never
        # uploaded. A web form's file picker can't reach into our container, so
        # these two keys are what make a stored transcript actually attachable:
        # the folder shows up in Files under "On My iPhone -> JobPilot".
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        SentryDSN: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rahil.jobpilot
        GENERATE_INFOPLIST_FILE: NO
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: JobPilot/JobPilot.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: JobPilot/JobPilotRelease.entitlements
schemes:
  JobPilot:
    build:
      targets:
        JobPilot: all
