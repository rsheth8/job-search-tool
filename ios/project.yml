# XcodeGen project definition — the whole Xcode project is generated from this text.
#   brew install xcodegen && cd ios && xcodegen generate && open Apply.xcodeproj
# (or just create a new SwiftUI app in Xcode and drop the Apply/ sources in).
name: Apply
options:
  bundleIdPrefix: com.rahil.apply
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""        # set your Apple Team ID in Xcode → Signing
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  Apply:
    type: application
    platform: iOS
    sources:
      - Apply
    info:
      path: Apply/Info.plist
      properties:
        CFBundleDisplayName: JobPilot
        UILaunchScreen:
          UIColorName: Fog
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
        SentryDSN: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rahil.apply
        GENERATE_INFOPLIST_FILE: NO
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Apply/Apply.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: Apply/ApplyRelease.entitlements
