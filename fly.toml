# Fly.io config for Job Search Intelligence.
#
# `fly launch --no-deploy` will overwrite `app`/`primary_region` with your own —
# the important parts are the volume mount and the always-warm machine, which it
# preserves. See deploy/README.md for the full runbook.

app = "job-search-tool"
primary_region = "iad"

[build]

[env]
  # Point SQLite at the mounted volume so data survives restarts/redeploys.
  DATABASE_PATH = "/data/job_search.db"

# The reminder scheduler is an in-process APScheduler loop, so the machine must
# stay warm — never auto-stop to zero, or reminders won't fire.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

# Persistent SQLite. Create with:
#   fly volumes create data --size 1 --region iad
[mounts]
  source = "data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
