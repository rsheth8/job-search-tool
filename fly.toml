# fly.toml app configuration file generated for job-search-tool on 2026-07-26T12:17:30-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'job-search-tool'
primary_region = 'iad'

# Swap, so a memory spike degrades into slowness instead of a SIGKILL. The LaTeX
# compile is short-lived and bursty — exactly the shape swap handles well.
#
# This MUST stay above the first table header. TOML assigns a bare key to the
# most recent [table], so written after [env] it silently became an environment
# variable named "swap_size_mb": `fly config validate` passed, the deploy
# succeeded, and the machine came up with SwapTotal: 0.
swap_size_mb = 512

[build]
[env]
  DATABASE_PATH = '/data/job_search.db'
  JOB_ALERT_MODE = 'digest'
  JOB_DIGEST_TOP_N = '5'
    JOB_DIRECTORY_BOARDS_PER_TICK = '40'
  JOB_DIRECTORY_DATA_PATH = 'data/ats_boards.json'
  JOB_DIRECTORY_MAX_JOBS_PER_BOARD = '25'
  JOB_MAX_SCORED_PER_TICK = '60'
  JOB_POLL_SECONDS = '600'
  JOB_RELEVANCE_THRESHOLD = '0.6'
    JOB_SOURCES_ENABLED = 'greenhouse,lever,ashby,workable,smartrecruiters,rss,directory,swelist,yc,workday,amazon,netflix,usajobs'
    JOB_WIDE_DIRECTORY_ENABLED = 'true'
    JOB_WIDE_RSS_ENABLED = 'true'
    JOB_WIDE_RSS_FEEDS = 'hn-hiring,remoteok,weworkremotely,himalayas,remotive'
    JOB_WIDE_SWELIST_ENABLED = 'true'
    JOB_SWELIST_LIST = 'summer2027,newgrad'
    JOB_SWELIST_MAX_AGE_DAYS = '21'
    JOB_WIDE_YC_ENABLED = 'true'
    JOB_WIDE_WORKDAY_ENABLED = 'true'
    JOB_WORKDAY_BOARDS_PER_TICK = '6'
    JOB_WORKDAY_MAX_JOBS_PER_BOARD = '25'
    JOB_WIDE_AMAZON_ENABLED = 'true'
    JOB_AMAZON_MAX_JOBS = '25'
    JOB_WIDE_NETFLIX_ENABLED = 'true'
    JOB_NETFLIX_MAX_JOBS = '25'
    JOB_WIDE_USAJOBS_ENABLED = 'true'
  RERANKER_ENABLED = 'true'
  JOB_CATALOG_PROBE_ENABLED = 'true'
  JOB_CATALOG_PROBE_PER_TICK = '6'
  JOB_VERIFY_APPLY_URLS = 'true'
  RESUME_TEX_DIR = '/data/resumes'
  AUTH_FAIL_OPEN = 'false'
  AUTH_ALLOW_DEV_LOGIN = 'false'
  LLM_MAX_CALLS_PER_USER_PER_DAY = '80'
  APPLY_CORS_ORIGINS = '*'
  APPLY_CORS_ORIGIN_REGEX = ''

[[mounts]]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  # 512mb OOM-killed uvicorn mid-request while a tester was preparing an
  # application. Tailoring runs a tectonic LaTeX compile, which is the largest
  # allocation this app ever makes, and the kernel took the whole process down
  # (anon-rss 302MB of ~470MB usable) — the machine rebooted and the request
  # died with it. It is intermittent by nature: the same endpoint returned 200
  # a minute later.
  memory = '1gb'
